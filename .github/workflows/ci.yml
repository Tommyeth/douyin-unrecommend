name: 检查与测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:vercel
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: npm run test:worker
        env:
          WRANGLER_SEND_METRICS: "false"
