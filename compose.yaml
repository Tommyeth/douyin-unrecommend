services:
  douyin:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/state.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
